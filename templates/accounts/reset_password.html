<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

/* CENTER */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#020617;
    overflow:hidden;
}

/* BACKGROUND (RED THEME FOR RECOVERY) */
.bg{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        radial-gradient(circle at 20% 30%, rgba(239,68,68,.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(239,68,68,.15), transparent 40%),
        #020617;
    animation: moveBg 6s ease-in-out infinite alternate;
}

@keyframes moveBg{
    0%{background-position:0% 50%, 100% 50%}
    100%{background-position:100% 50%, 0% 50%}
}

/* SCAN (INSIDE STYLE MATCH) */
.scan{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    z-index:0;
}

.scan.active{
    opacity:1;
}

.scan::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:-20%;
    height:40%;
    background:linear-gradient(
        to bottom,
        transparent,
        rgba(239,68,68,0.5),
        transparent
    );
    filter: blur(6px);
    animation: scanMove 4s ease-in-out;
}

@keyframes scanMove{
    0%{transform:translateY(-100%); opacity:0;}
    20%{opacity:1;}
    80%{opacity:1;}
    100%{transform:translateY(200%); opacity:0;}
}

/* CARD (GLASS + NEON) */
.card{
    width:380px;
    padding:30px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);

    border:1px solid rgba(239,68,68,0.3);
    box-shadow:0 0 30px rgba(239,68,68,0.4);

    border-radius:14px;
    text-align:center;
    position:relative;
    overflow:hidden;
}

/* TEXT */
h2{
    color:#f87171;
    text-shadow:0 0 10px #ef4444;
    margin-bottom:10px;
}

p{
    color:#aaa;
    font-size:14px;
    margin-bottom:20px;
}

/* INPUT */
.input-group {
    position: relative;
    margin-bottom: 20px;
    text-align: left;
}

.input-group label {
    display: block;
    color: #f87171;
    font-size: 12px;
    margin-bottom: 5px;
    letter-spacing: 1px;
}

input {
    width:100%;
    padding:10px;
    background:rgba(0,0,0,0.2);
    border:none;
    border-bottom:2px solid #555;
    color:white;
    font-size:16px;
    outline:none;
    transition:.3s;
}

input.otp-input {
    text-align:center;
    letter-spacing:6px;
    font-size:20px;
}

input:focus{
    border-bottom:2px solid #ef4444;
    box-shadow:0 5px 10px rgba(239,68,68,0.2);
}

/* BUTTON */
button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:20px;
    background:linear-gradient(135deg,#ef4444,#b91c1c);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    box-shadow:0 0 15px #ef4444;
}

/* MESSAGE */
.error{
    color:#ff4d4d;
    font-size:13px;
    margin-bottom:10px;
}

.success{
    color:#22c55e;
    font-size:13px;
    margin-bottom:10px;
}

.switch-back {
    margin-top: 15px;
    font-size: 13px;
}

.switch-back a {
    color: #ef4444;
    text-decoration: none;
}

.switch-back a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

    <!-- SCAN INSIDE CARD -->
    <div class="scan" id="scan"></div>

    <h2>Reset Password</h2>
    <p>Enter your OTP and set a new password</p>

    {% if messages %}
        {% for message in messages %}
            <div class="{% if message.tags == 'success' %}success{% else %}error{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="input-group">
            <label>OTP CODE</label>
            <input type="text" name="otp" class="otp-input" maxlength="6" placeholder="------" required>
        </div>
        <div class="input-group">
            <label>NEW PASSWORD</label>
            <input type="password" name="password" required>
        </div>
        <div class="input-group">
            <label>CONFIRM PASSWORD</label>
            <input type="password" name="confirm" required>
        </div>
        <button type="submit" onclick="triggerScan()">Reset Password</button>
    </form>

    <div class="switch-back">
        <a href="{% url 'auth' %}">Back to Login</a>
    </div>

</div>

<script>
function triggerScan(){
    const scan = document.getElementById('scan');
    scan.classList.add('active');
    setTimeout(()=>scan.classList.remove('active'),4000);
}
</script>

</body>
</html>
