{% extends "base.html" %}

{% block title %}Password Changed{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto">

    <div class="glass rounded-xl p-8 text-center">

        <div class="text-6xl mb-4">
            🔒
        </div>

        <h2 class="text-3xl font-bold text-green-400 mb-4">
            Password Updated Successfully
        </h2>

        <p class="text-gray-400 mb-6">
            Your password has been changed successfully.
            For security reasons, please keep it confidential.
        </p>

        <div class="flex justify-center gap-4">

            <a href="{% url 'profile' %}"
               class="px-6 py-3 bg-cyan-500 text-black rounded-lg font-semibold hover:bg-cyan-400 transition">

                Go to Profile

            </a>

            <a href="{% url 'home' %}"
               class="px-6 py-3 border border-cyan-500 text-cyan-400 rounded-lg hover:bg-cyan-500 hover:text-black transition">

                Dashboard

            </a>

        </div>

    </div>

</div>

{% endblock %}
