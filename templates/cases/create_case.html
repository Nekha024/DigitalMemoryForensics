{% extends "base.html" %}

{% block title %}Create Case{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

    <div class="glass p-8 rounded-3xl">

        <h2 class="text-2xl text-cyan-400 mb-6 font-bold tracking-wide">
            Create New Case
        </h2>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            {% for field in form %}
                <div class="flex flex-col">
                    <label class="text-slate-400 text-sm font-medium tracking-wide">
                        {{ field.label }}
                    </label>
                    
                    {{ field }}
                    
                    {% if field.errors %}
                        <p class="text-red-400 text-xs mt-1 font-medium">
                            {{ field.errors|striptags }}
                        </p>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="flex justify-between items-center pt-4 mt-6">

                <a href="{% url 'home' %}" class="btn-outline flex items-center justify-center text-sm font-semibold">
                    ← Cancel
                </a>

                <button type="submit" class="btn-primary">
                    Save Case
                </button>

            </div>

        </form>

    </div>

</div>
{% endblock %}
