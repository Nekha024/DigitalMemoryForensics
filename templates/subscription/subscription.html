<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subscription Plans</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    min-height:100vh;
    background:#020617;
    overflow-x:hidden;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px 20px;
    position:relative;
}

/* BACKGROUND */

body::before{
    content:'';
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at 20% 30%, rgba(124,58,237,.25), transparent 35%),
    radial-gradient(circle at 80% 70%, rgba(249,115,22,.18), transparent 35%),
    radial-gradient(circle at 50% 50%, rgba(59,130,246,.12), transparent 40%);

    z-index:-2;
}

body::after{
    content:'';
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);

    background-size:40px 40px;

    z-index:-1;
}

.wrapper{
    width:100%;
    max-width:1300px;
}

/* TITLE */

.title{
    text-align:center;
    margin-bottom:40px;
}

.title h1{
    font-size:56px;
    font-weight:800;
    margin-bottom:15px;

    background:linear-gradient(to right,#7c3aed,#9333ea,#f97316);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.title p{
    color:#94a3b8;
    font-size:17px;
}

/* TOGGLE */

.toggle-wrapper{

    width:max-content;

    margin:auto;
    margin-bottom:60px;

    padding:8px;

    border-radius:18px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    display:flex;
    gap:10px;
}

.toggle-btn{

    padding:12px 24px;

    border:none;
    border-radius:12px;

    background:transparent;

    color:#cbd5e1;

    font-size:14px;
    font-weight:700;

    cursor:pointer;

    transition:.35s;
}

.toggle-btn.active{

    background:linear-gradient(135deg,#7c3aed,#9333ea);

    color:white;

    box-shadow:
    0 0 15px rgba(124,58,237,.4);
}

/* CARDS */

.container{
    display:flex;
    justify-content:center;
    gap:35px;
    flex-wrap:wrap;
}

.card{
    width:320px;
    padding:35px 30px;
    border-radius:24px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    position:relative;
    overflow:hidden;

    transition:.45s ease;

    box-shadow:
    0 0 20px rgba(124,58,237,.15),
    inset 0 0 20px rgba(255,255,255,.03);
}

.card:hover{
    transform:translateY(-12px) scale(1.02);

    border:1px solid rgba(168,85,247,.5);

    box-shadow:
    0 0 30px rgba(124,58,237,.45),
    0 0 60px rgba(249,115,22,.18);
}

.card h2{
    font-size:30px;
    margin-bottom:20px;
    text-align:center;
    font-weight:700;
}

.price{
    font-size:52px;
    font-weight:800;
    text-align:center;
    margin-bottom:25px;

    background:linear-gradient(to right,#7c3aed,#f97316);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.description{
    color:#cbd5e1;
    text-align:center;
    line-height:1.7;
    margin-bottom:20px;
}

.duration{
    text-align:center;
    margin-bottom:30px;
    color:#94a3b8;
}

.subscribe-btn{
    width:100%;
    padding:14px;

    border:none;
    border-radius:14px;

    background:linear-gradient(135deg,#7c3aed,#9333ea);

    color:white;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    transition:.35s;
}

.subscribe-btn:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 20px rgba(124,58,237,.6),
    0 0 40px rgba(249,115,22,.25);
}

.popular{
    border:1px solid rgba(249,115,22,.45);

    transform:scale(1.05);

    box-shadow:
    0 0 25px rgba(249,115,22,.35);
}

.badge{
    position:absolute;
    top:18px;
    right:18px;

    background:#f97316;
    color:white;

    padding:6px 12px;
    border-radius:30px;

    font-size:12px;
    font-weight:700;
}

@media(max-width:1000px){

    .container{
        flex-direction:column;
        align-items:center;
    }

    .popular{
        transform:none;
    }

    .title h1{
        font-size:42px;
    }
}

</style>

</head>

<body>

<div class="wrapper">

    <div class="title">

        <h1>Subscription Plans</h1>

        <p>
            Choose the perfect package
        </p>

    </div>

    <!-- TOGGLE -->

    <div class="toggle-wrapper">

        <button class="toggle-btn active" data-type="month">
            1 Month
        </button>

        <button class="toggle-btn" data-type="six">
            6 Months
        </button>

        <button class="toggle-btn" data-type="year">
            1 Year
        </button>

    </div>

    <!-- CARDS -->

    <div class="container">

        {% for plan in plans %}

        <div class="card {% if forloop.counter == 2 %}popular{% endif %}">

            {% if forloop.counter == 2 %}
            <div class="badge">
                POPULAR
            </div>
            {% endif %}

            <h2>{{ plan.name }}</h2>

            <!-- PRICE -->

            <div class="price"
                 data-month="{{ plan.price }}"
                 data-six="{% if plan.name == 'SILVER' %}799{% elif plan.name == 'GOLD' %}1099{% else %}1599{% endif %}"
                 data-year="{% if plan.name == 'SILVER' %}1499{% elif plan.name == 'GOLD' %}1999{% else %}2999{% endif %}">

                ₹{{ plan.price }}

            </div>

            <p class="description">
                {{ plan.description }}
            </p>

            <!-- DURATION -->

            <p class="duration">
                1 Month Access
            </p>

            <form method="POST">

                {% csrf_token %}

                <input type="hidden" name="plan_id" value="{{ plan.id }}">
                <input type="hidden" name="billing_type" class="billing-type-input" value="month">

                <button type="submit" class="subscribe-btn">
                    Subscribe
                </button>

            </form>

        </div>

        {% endfor %}

    </div>

</div>

<script>

const buttons = document.querySelectorAll(".toggle-btn");

const prices = document.querySelectorAll(".price");

const durations = document.querySelectorAll(".duration");

buttons.forEach(button => {

    button.addEventListener("click", () => {

        buttons.forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        const type = button.getAttribute("data-type");

        prices.forEach(price => {

            const value = price.getAttribute(`data-${type}`);

            price.innerHTML = `₹${value}`;

        });

        durations.forEach(duration => {

            if(type === "month"){
                duration.innerHTML = "1 Month Access";
            }

            else if(type === "six"){
                duration.innerHTML = "6 Months Access";
            }

            else{
                duration.innerHTML = "1 Year Access";
            }

        });

        const billingTypeInputs = document.querySelectorAll(".billing-type-input");
        billingTypeInputs.forEach(input => {
            input.value = type;
        });

    });

});

</script>

</body>
</html>
