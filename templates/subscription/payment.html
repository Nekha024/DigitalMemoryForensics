<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Payment — Digital Forensics</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    min-height:100vh;
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background-image:
    linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size:40px 40px;
}

.payment-card{
    width:100%;
    max-width:480px;
    padding:50px 40px;
    margin:auto;
    border-radius:24px;
    background:linear-gradient(145deg, rgba(15,35,55,0.9), rgba(2,8,23,0.95));
    border:1px solid rgba(0,255,255,0.12);
    backdrop-filter:blur(18px);
    text-align:center;
    box-shadow:
        0 0 40px rgba(0,255,255,.1),
        inset 0 0 30px rgba(255,255,255,.02);
}

.badge{
    display:inline-block;
    padding:6px 16px;
    border-radius:30px;
    background:rgba(6,182,212,.15);
    border:1px solid rgba(6,182,212,.3);
    color:#22d3ee;
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    margin-bottom:20px;
}

h1{
    font-size:36px;
    font-weight:800;
    margin-bottom:8px;
    background:linear-gradient(to right,#67e8f9,#22d3ee);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.plan-name{
    color:#94a3b8;
    font-size:15px;
    margin-bottom:30px;
}

.divider{
    height:1px;
    background:rgba(255,255,255,.06);
    margin:24px 0;
}

.price-block{
    margin:20px 0 28px;
}

.price{
    font-size:64px;
    font-weight:800;
    line-height:1;
    background:linear-gradient(135deg,#67e8f9,#06b6d4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.price-sub{
    color:#64748b;
    font-size:14px;
    margin-top:6px;
}

.duration-tag{
    display:inline-block;
    padding:8px 20px;
    border-radius:30px;
    background:rgba(6,182,212,.1);
    border:1px solid rgba(6,182,212,.2);
    color:#67e8f9;
    font-size:14px;
    font-weight:600;
    margin-bottom:30px;
}

#rzp-button1{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg, #06b6d4, #0891b2);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.3s ease;
    letter-spacing:.03em;
}

#rzp-button1:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(6,182,212,.5);
}

#rzp-button1:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.error-msg{
    margin-top:18px;
    padding:12px 16px;
    border-radius:10px;
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.3);
    color:#f87171;
    font-size:14px;
    display:none;
    text-align:left;
}

.back-link{
    display:block;
    margin-top:20px;
    color:#475569;
    font-size:13px;
    text-decoration:none;
    transition:.2s;
}

.back-link:hover{
    color:#94a3b8;
}

</style>

</head>

<body>

<div class="payment-card">

    <div class="badge">SECURE CHECKOUT</div>

    <h1>Complete Payment</h1>

    <p class="plan-name">
        <strong style="color:#e2e8f0;">{{ plan.name }}</strong> Plan
    </p>

    <div class="divider"></div>

    <div class="price-block">
        <div class="price">₹{{ final_price }}</div>
        <div class="price-sub">One-time payment · Test Mode</div>
    </div>

    <div class="duration-tag">{{ duration }} Days Access</div>

    <button id="rzp-button1">Pay Now</button>

    <div class="error-msg" id="payment-error"></div>

    <a class="back-link" href="{% url 'subscription_page' %}">← Back to plans</a>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

var options = {
    "key":         "{{ razorpay_key }}",
    "amount":      {{ payment.amount }},
    "currency":    "INR",
    "name":        "Digital Forensics",
    "description": "{{ plan.name }} Plan — {{ duration }} Days",
    "order_id":    "{{ payment.id }}",

    // callback_url = Razorpay POSTs payment IDs directly to Django.
    // This fixes the about:blank issue caused by test-mode redirect flows.
    "callback_url": "{{ callback_url }}",

    "prefill": {
        "name":  "{{ user_name }}",
        "email": "{{ user_email }}"
    },

    "theme": {
        "color": "#06b6d4"
    },

    "modal": {
        "ondismiss": function() {
            var btn = document.getElementById('rzp-button1');
            btn.disabled    = false;
            btn.innerText   = 'Pay Now';
        }
    }
};

var rzp1 = new Razorpay(options);

rzp1.on('payment.failed', function(response){
    var errBox = document.getElementById('payment-error');
    errBox.style.display = 'block';
    errBox.innerText     = '⚠ Payment failed: ' +
        (response.error.description || 'Unknown error. Please try again.');
    var btn = document.getElementById('rzp-button1');
    btn.disabled  = false;
    btn.innerText = 'Retry Payment';
});

document.getElementById('rzp-button1').onclick = function(e){
    e.preventDefault();
    this.disabled  = true;
    this.innerText = 'Opening...';
    document.getElementById('payment-error').style.display = 'none';
    rzp1.open();
};

</script>

</body>
</html>
