{% extends 'base.html' %}


{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
    background-image:
    linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
}

.payment-card{

    width:100%;
    max-width:500px;

    padding:45px 40px;
    margin:auto;

    border-radius:24px;

    background:linear-gradient(
        145deg,
        rgba(15,35,55,0.85),
        rgba(2,8,23,0.92)
    );

    border:1px solid rgba(0,255,255,0.12);

    backdrop-filter:blur(18px);

    text-align:center;

    box-shadow:
    0 0 35px rgba(0,255,255,.12),
    inset 0 0 25px rgba(255,255,255,.02);
}

h1{
    font-size:42px;
    margin-bottom:20px;

    background:linear-gradient(to right,#67e8f9,#22d3ee);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.price{
    font-size:60px;
    font-weight:800;

    margin:30px 0;

    background:linear-gradient(to right,#67e8f9,#06b6d4);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:0 0 18px rgba(34,211,238,.35);
}

p{
    color:#cbd5e1;
    margin-bottom:15px;
}

button{

    width:100%;

    padding:15px;

    border:none;
    border-radius:14px;

    background:linear-gradient(
        135deg,
        #06b6d4,
        #22d3ee
    );

    color:#02111b;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:.3s ease;
}

button:hover{
    transform:translateY(-2px);

    box-shadow:
    0 0 20px rgba(34,211,238,.45);
}

</style>

</head>

<body>

<div class="payment-card">

    <h1>Complete Payment</h1>

    <p>
        You selected
        <strong>{{ plan.name }}</strong>
    </p>

    <div class="price">
        ₹{{ final_price }}.00
    </div>

    <p>
        {{ duration }} Days Access
    </p>

    <button id="rzp-button1">
        Pay Now
    </button>

    <form action="{% url 'payment_success' %}" method="POST">

        {% csrf_token %}

        <input type="hidden" name="plan_id" value="{{ plan.id }}">

        <input type="hidden" name="duration" value="{{ duration }}">

        <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">

        <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">

        <input type="hidden" name="razorpay_signature" id="razorpay_signature">

    </form>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

var options = {

    "key": "{{ razorpay_key }}",

    "amount": "{{ payment.amount }}",

    "currency": "INR",

    "name": "Digital Forensics",

    "description": "Subscription Payment",

    "order_id": "{{ payment.id }}",

    "handler": function (response){

        document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;

        document.getElementById('razorpay_order_id').value = response.razorpay_order_id;

        document.getElementById('razorpay_signature').value = response.razorpay_signature;

        document.forms[0].submit();
    }
};

var rzp1 = new Razorpay(options);

document.getElementById('rzp-button1').onclick = function(e){

    rzp1.open();

    e.preventDefault();
}

</script>

</body>
</html>

{% endblock %}
