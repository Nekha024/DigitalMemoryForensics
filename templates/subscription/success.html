<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Success</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    min-height:100vh;
    background:#020617;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
    position:relative;
}

/* BACKGROUND GLOW */
body::before{
    content:'';
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at 20% 30%, rgba(34,197,94,.20), transparent 35%),
    radial-gradient(circle at 80% 70%, rgba(124,58,237,.18), transparent 35%),
    radial-gradient(circle at 50% 50%, rgba(59,130,246,.10), transparent 40%);

    z-index:-2;
}

/* GRID EFFECT */
body::after{
    content:'';
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);

    background-size:40px 40px;

    z-index:-1;
}

.success-card{

    width:100%;
    max-width:550px;

    padding:50px 40px;

    border-radius:24px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    text-align:center;

    box-shadow:
    0 0 30px rgba(34,197,94,.25);

    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* SUCCESS ICON */
.success-icon{

    width:120px;
    height:120px;

    margin:auto;
    margin-bottom:30px;

    border-radius:50%;

    background:rgba(34,197,94,.12);

    display:flex;
    justify-content:center;
    align-items:center;

    animation:pop 0.6s ease forwards;
}

@keyframes pop{

    0%{
        transform:scale(0);
    }

    70%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
    }
}

.checkmark{

    font-size:60px;
    color:#22c55e;

    font-weight:bold;
}

/* TITLE */
h1{

    font-size:44px;
    margin-bottom:18px;

    background:linear-gradient(to right,#22c55e,#4ade80);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* TEXT */
p{
    color:#cbd5e1;
    font-size:17px;
    line-height:1.8;

    margin-bottom:18px;
}

.redirect{
    color:#94a3b8;
    font-size:14px;
    margin-top:15px;
}

/* BUTTON */
a{

    display:inline-block;

    margin-top:25px;

    padding:14px 30px;

    border-radius:14px;

    text-decoration:none;

    background:linear-gradient(135deg,#7c3aed,#9333ea);

    color:white;

    font-weight:700;

    transition:.35s;
}

a:hover{

    transform:scale(1.05);

    box-shadow:
    0 0 20px rgba(124,58,237,.6),
    0 0 40px rgba(249,115,22,.25);
}

</style>

</head>

<body>

<div class="success-card">

    <div class="success-icon">

        <div class="checkmark">
            ✓
        </div>

    </div>

    <h1>Payment Successful</h1>

    <p>
        Your subscription has been activated successfully.
        Welcome to the Digital Forensics platform.
    </p>

    <p class="redirect">
        Redirecting to home page in 10 seconds...
    </p>

    <a href="/">
        Go Home
    </a>
    <audio id="successSound" autoplay>
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>
</div>

<script>

setTimeout(function(){

    window.location.href = "/";

}, 10000);

</script>

</body>
</html>
